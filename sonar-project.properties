sonar.projectKey=nipalab_nipa-gui
sonar.organization=nipalab

sonar.projectName=nipa-gui
sonar.sourceEncoding=UTF-8

sonar.sources=src

# C++ analysis runs in CI against the CMake compilation database produced by the
# build job (no build-wrapper needed).
sonar.cfamily.compile-commands=build/compile_commands.json

sonar.coverageReportPaths=build/coverage.xml
sonar.coverage.exclusions=src/main.cpp

sonar.exclusions=**/build/**,**/*.pb.cc,**/*.pb.h,**/*.grpc.pb.cc,**/*.grpc.pb.h
